{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: fleetos-web
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: fleetos-web
  template:
    metadata:
      labels:
        app: fleetos-web
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_API_URL
              value: "http://{{ .Release.Name }}-api:{{ .Values.api.service.port }}"
            - name: VITE_WS_URL
              value: "ws://{{ .Release.Name }}-api:{{ .Values.api.service.port }}"
            - name: VITE_SIM_URL
              value: "http://{{ .Release.Name }}-simulator:{{ .Values.simulator.service.port | default 8085 }}"
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  type: {{ .Values.web.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.web.service.port | default 5173 }}
      targetPort: http
      name: http
      {{- if .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
  selector:
    app: fleetos-web
{{- end }}
