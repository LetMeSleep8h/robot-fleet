{{- if .Values.simulator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-simulator
  labels:
    app: fleetos-simulator
    app.kubernetes.io/name: simulator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.simulator.replicaCount }}
  selector:
    matchLabels:
      app: fleetos-simulator
  template:
    metadata:
      labels:
        app: fleetos-simulator
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: simulator
          securityContext:
            allowPrivilegeEscalation: false
          image: "{{ .Values.simulator.image.repository }}:{{ .Values.simulator.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: ROBOT_ID
              value: "robot-0001"
            - name: GRPC_TARGET
              value: "{{ .Release.Name }}-ingestion:{{ .Values.ingestion.service.port }}"
            - name: INFERENCE_URL
              value: "http://{{ .Release.Name }}-inference:{{ .Values.inference.service.port }}"
            - name: SIM_STEP_HZ
              value: "50"
            - name: TELEMETRY_HZ
              value: "10"
            - name: FRAME_PORT
              value: "8085"
            - name: S3_ENDPOINT
              value: "{{ .Release.Name }}-minio:9000"
            - name: S3_BUCKET
              value: "fleetos-models"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-s3-secret
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-s3-secret
                  key: secret-key
          resources:
            {{- toYaml .Values.simulator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-simulator
spec:
  type: {{ .Values.simulator.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.simulator.service.port | default 8085 }}
      targetPort: http
      name: http
      {{- if .Values.simulator.service.nodePort }}
      nodePort: {{ .Values.simulator.service.nodePort }}
      {{- end }}
  selector:
    app: fleetos-simulator
{{- end }}
