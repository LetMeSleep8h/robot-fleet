{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: fleetos-api
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ .Release.Name }}-api:{{ .Values.api.service.port }}']
      - job_name: fleetos-processor
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ .Release.Name }}-processor:9090']
  alerts.yml: |
    groups:
      - name: fleet_health
        rules:
          - alert: RobotOffline
            expr: time() - fleetos_robot_last_seen_seconds > 300
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Robot {{ "{{" }} $labels.robot_id {{ "}}" }} offline"
          - alert: FleetErrorRateHigh
            expr: rate(fleetos_http_requests_total{status=~"5.."}[5m]) / rate(fleetos_http_requests_total[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  type: {{ (.Values.prometheus.service).type | default "ClusterIP" }}
  ports:
    - port: 9090
      targetPort: 9090
      name: http
      {{- if (.Values.prometheus.service).nodePort }}
      nodePort: {{ (.Values.prometheus.service).nodePort }}
      {{- end }}
  selector:
    app: prometheus
{{- end }}
