{{- if .Values.kubeflow.enabled }}
# Kubeflow training backend for the Temporal training pipeline.
# Requires Kubeflow Trainer v2 (TrainJob CRDs) and Katib installed in the
# cluster — see scripts/k3s-setup.sh. The worker creates:
#   - TrainJobs on the fleetos-sb3 runtime (train, then evaluate)
#   - Katib Experiments (hyperparameter search) whose trials are batch Jobs
# in .Values.kubeflow.namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.kubeflow.namespace }}
  labels:
    app.kubernetes.io/part-of: fleetos
    # Katib injects its metrics-collector sidecar into trials in this namespace.
    katib.kubeflow.org/metrics-collector-injection: enabled
---
# S3 + callback settings for training/eval/trial containers.
apiVersion: v1
kind: Secret
metadata:
  name: fleetos-training
  namespace: {{ .Values.kubeflow.namespace }}
  labels:
    app.kubernetes.io/part-of: fleetos
type: Opaque
stringData:
  S3_ENDPOINT: "{{ .Release.Name }}-minio.{{ .Release.Namespace }}.svc.cluster.local:9000"
  S3_BUCKET: {{ .Values.training.modelsBucket | default "fleetos-models" | quote }}
  S3_ACCESS_KEY: {{ .Values.minioStandalone.rootUser | quote }}
  S3_SECRET_KEY: {{ .Values.minioStandalone.rootPassword | quote }}
  TRAINING_CALLBACK_URL: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}/api/v1/internal/training/callback"
  EVAL_CALLBACK_URL: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}/api/v1/internal/eval/callback"
---
# Single-node runtime that runs FleetOS training scripts in the training image.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: {{ .Values.kubeflow.runtime }}
  labels:
    trainer.kubeflow.org/framework: torch
    app.kubernetes.io/part-of: fleetos
spec:
  mlPolicy:
    numNodes: 1
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  containers:
                    - name: node
                      image: "{{ .Values.kubeflow.image.repository }}:{{ .Values.kubeflow.image.tag }}"
                      imagePullPolicy: {{ .Values.kubeflow.imagePullPolicy }}
                      envFrom:
                        - secretRef:
                            name: fleetos-training
                      resources:
                        {{- toYaml .Values.kubeflow.resources | nindent 24 }}
---
# The worker creates TrainJobs and Katib Experiments in the training namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: fleetos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetos-training-submitter
  namespace: {{ .Values.kubeflow.namespace }}
  labels:
    app.kubernetes.io/part-of: fleetos
rules:
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["kubeflow.org"]
    resources: ["experiments", "trials"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-worker-training-submitter
  namespace: {{ .Values.kubeflow.namespace }}
  labels:
    app.kubernetes.io/part-of: fleetos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetos-training-submitter
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
