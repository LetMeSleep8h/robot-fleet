apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  dsn: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.auth.username .Values.secrets.postgresql.password .Release.Name .Values.postgresql.auth.database | b64enc }}
  password: {{ .Values.secrets.postgresql.password | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwt.secret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- if .Values.minioStandalone.enabled }}
  access-key: {{ .Values.minioStandalone.rootUser | b64enc }}
  secret-key: {{ .Values.minioStandalone.rootPassword | b64enc }}
  {{- else }}
  access-key: {{ .Values.minio.auth.rootUser | b64enc }}
  secret-key: {{ .Values.secrets.minio.rootPassword | b64enc }}
  {{- end }}
