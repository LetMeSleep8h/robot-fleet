global:
  environment: dev
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

# --- Centralized secrets (override in values-local.yaml or sealed-secrets) ---
secrets:
  postgresql:
    password: fleetos-dev
  minio:
    rootPassword: fleetos123
  jwt:
    secret: dev-secret-change-me

# --- Ingestion Service ---
ingestion:
  replicaCount: 2
  image:
    repository: fleetos/ingestion
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 50051
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# --- API Service ---
api:
  replicaCount: 3
  image:
    repository: fleetos/api
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  ingress:
    enabled: true
    className: nginx
    host: api.fleetos.dev
    tls: true

# --- Processor Service ---
processor:
  replicaCount: 2
  image:
    repository: fleetos/processor
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# --- Worker Service (Temporal) ---
worker:
  replicaCount: 2
  image:
    repository: fleetos/worker
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# --- Inference Service ---
inference:
  replicaCount: 1
  image:
    repository: fleetos/inference
    tag: latest
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8081
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# --- Simulator ---
simulator:
  enabled: true
  replicaCount: 1
  image:
    repository: fleetos/simulator
    tag: latest
  robotCount: 10
  tickIntervalMs: 100
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8085

# --- Web Dashboard ---
web:
  enabled: true
  replicaCount: 1
  image:
    repository: fleetos/web
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 5173

# --- Temporal ---
temporal:
  enabled: true
  image:
    repository: temporalio/auto-setup
    tag: "1.25"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- PostgreSQL (Bitnami subchart) ---
postgresql:
  enabled: true
  auth:
    username: fleetos
    password: fleetos-dev
    database: fleetos
  primary:
    persistence:
      size: 20Gi
    initdb:
      scriptsConfigMap: "{{ .Release.Name }}-initdb"
  readReplicas:
    replicaCount: 2

# --- Redis (Bitnami subchart) ---
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: false
  sentinel:
    enabled: true
  master:
    persistence:
      size: 5Gi

# --- Kafka (Bitnami subchart — KRaft mode, no ZooKeeper) ---
kafka:
  enabled: true
  controller:
    replicaCount: 3
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
  persistence:
    size: 50Gi

# --- MinIO (Bitnami subchart) ---
minio:
  enabled: true
  auth:
    rootUser: fleetos
    rootPassword: fleetos123
  defaultBuckets: "fleetos-telemetry,fleetos-models,fleetos-training-data"
  persistence:
    size: 100Gi

# --- Observability ---
prometheus:
  enabled: true
  server:
    retention: 30d
    persistentVolume:
      size: 50Gi

grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: true
    size: 5Gi

# --- Istio Service Mesh ---
istio:
  enabled: true
  mtls:
    mode: STRICT
  virtualService:
    canary:
      weight: 0

# --- Kubeflow (MLOps) ---
kubeflow:
  enabled: true
  namespace: kubeflow
  training:
    image:
      repository: fleetos/training
      tag: latest
    defaultTimesteps: 2000000
    defaultEnv: "FleetOS-Humanoid-v1"
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      workload: training
    s3:
      bucket: fleetos-models
      experiencePrefix: experience/
  katib:
    enabled: true
    maxTrials: 20
    parallelTrials: 3
    parameters:
      learningRate:
        min: "0.0001"
        max: "0.001"
      batchSize:
        values: ["32", "64", "128"]
      nEpochs:
        min: "5"
        max: "15"
