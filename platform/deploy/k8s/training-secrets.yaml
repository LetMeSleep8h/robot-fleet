# Secrets for Argo Workflow training pods to connect to FleetOS services.
# All services run in the fleetos namespace in the same K8s cluster.
apiVersion: v1
kind: Secret
metadata:
  name: fleetos-training
  namespace: argo
type: Opaque
stringData:
  S3_ENDPOINT: "fleetos-platform-minio.fleetos.svc.cluster.local:9000"
  S3_BUCKET: "fleetos-models"
  S3_ACCESS_KEY: "fleetos"
  S3_SECRET_KEY: "fleetos123"
  # Training scripts read TRAINING_CALLBACK_URL (was CALLBACK_URL, which nothing read).
  TRAINING_CALLBACK_URL: "http://fleetos-platform-api.fleetos.svc.cluster.local:8080/api/v1/internal/training/callback"
  EVAL_CALLBACK_URL: "http://fleetos-platform-api.fleetos.svc.cluster.local:8080/api/v1/internal/eval/callback"
  PUSHGATEWAY_URL: "http://fleetos-platform-prometheus.fleetos.svc.cluster.local:9090"
