apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fleetos-reach-training
spec:
  entrypoint: train-and-eval
  arguments:
    parameters:
      - name: job-id
        value: "reach-default"
      - name: timesteps
        value: "500000"
      - name: learning-rate
        value: "0.0003"
      - name: buffer-size
        value: "1000000"
      - name: batch-size
        value: "256"
      - name: episodes
        value: "20"

  templates:
    - name: train-and-eval
      dag:
        tasks:
          - name: train
            template: train
          - name: evaluate
            template: evaluate
            dependencies: [train]

    - name: train
      container:
        image: fleetos/training:latest
        imagePullPolicy: Never
        command: [python, train_reach.py]
        args:
          - "--job-id={{workflow.parameters.job-id}}"
          - "--timesteps={{workflow.parameters.timesteps}}"
          - "--learning-rate={{workflow.parameters.learning-rate}}"
          - "--buffer-size={{workflow.parameters.buffer-size}}"
          - "--batch-size={{workflow.parameters.batch-size}}"
          - "--output-dir=/tmp/output"
        envFrom:
          - secretRef:
              name: fleetos-training
        resources:
          requests:
            cpu: "2"
            memory: 3Gi
          limits:
            cpu: "4"
            memory: 4Gi

    # Writes evaluations/<job-id>/eval_results.json (pass_rate, mean_reward)
    # and calls EVAL_CALLBACK_URL — same contract as the locomotion eval.
    - name: evaluate
      container:
        image: fleetos/training:latest
        imagePullPolicy: Never
        command: [python, evaluate_reach.py]
        args:
          - "--eval-id={{workflow.parameters.job-id}}"
          - "--model-path=s3://fleetos-models/training/{{workflow.parameters.job-id}}/policy.zip"
          - "--episodes={{workflow.parameters.episodes}}"
          - "--output-dir=/tmp/eval"
        envFrom:
          - secretRef:
              name: fleetos-training
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 3Gi
