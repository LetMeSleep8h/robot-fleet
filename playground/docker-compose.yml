services:
  simulator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.simulator
    ports:
      - "8085:8085"
    environment:
      ROBOT_ID: "robot-0001"
      GRPC_TARGET: "host.docker.internal:30051"
      INFERENCE_URL: "http://host.docker.internal:30081"
      SIM_STEP_HZ: "50"
      TELEMETRY_HZ: "10"
      FRAME_PORT: "8085"
      S3_ENDPOINT: "host.docker.internal:9000"
      S3_BUCKET: "fleetos-models"
      S3_ACCESS_KEY: "fleetos"
      S3_SECRET_KEY: "fleetos123"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://host.docker.internal:30880"
      VITE_WS_URL: "ws://host.docker.internal:30880"
      VITE_SIM_URL: "http://host.docker.internal:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ros2-bridge:
    build:
      context: ./ros2_bridge
      dockerfile: Dockerfile
    environment:
      ROS_DOMAIN_ID: "0"
    restart: unless-stopped
